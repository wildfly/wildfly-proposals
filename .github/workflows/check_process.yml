name: Check Proposals

on:
  pull_request_target:

jobs:
  check-proposals:
    runs-on: ubuntu-latest

    permissions:
      contents: read # to download a workflow artifact
      pull-requests: write

    steps:
      # NOTE: this job runs from 'pull_request_target', so it has the base
      # repository's token and secrets. Never check out or execute the fork's
      # code here: check out the base branch and treat the pull request's
      # content as data only.
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Get all proposals files that have changed
        id: changed-proposals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail

          # List the changed files through the API, so that no fork code and no
          # fork git history has to be checked out to compute the diff.
          # Each line is "<status><TAB><filename>", so that the newly added
          # proposals can be told apart from the modified ones.
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                    --jq '.[] | select(.status != "removed") | "\(.status)\t\(.filename)"' \
                  | { grep -E '\.adoc$' || true; } \
                  | { grep -vE $'\t_[^/]+/' || true; } \
                  | { grep -vE $'\t(index|design-doc-template)\.adoc$' || true; })
          changed=$(echo "$files" | cut -f2- | { grep . || true; })
          added=$(echo "$files" | awk -F'\t' '$1 == "added" { print $2 }')

          if [ -z "$changed" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch the pull request head into the base checkout without checking
          # it out, then extract only the changed AsciiDoc files. These are read
          # as data by the checker, they are never executed.
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          rm -rf pr-proposals
          while IFS= read -r file; do
            mkdir -p "pr-proposals/$(dirname "$file")"
            git show "FETCH_HEAD:${file}" > "pr-proposals/${file}"
          done <<< "$changed"

          {
            echo "any_changed=true"
            echo "all_changed_files<<EOF"
            echo "$changed" | sed 's|^|pr-proposals/|'
            echo "EOF"
            echo "new_files<<EOF"
            echo "$added" | sed 's|^|pr-proposals/|'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Check files that have changed
        if: steps.changed-proposals.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROPOSAL_FILES: ${{ steps.changed-proposals.outputs.all_changed_files }}
          NEW_PROPOSAL_FILES: ${{ steps.changed-proposals.outputs.new_files }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "Check all proposals files that have changed: $PROPOSAL_FILES"
          ./.scripts/check_proposals $PR_NUMBER $PROPOSAL_FILES
